name: Human Web Smoke Test
on:
  push:
    branches: [feature/freeform-card-play-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: mvn -q -DskipTests package dependency:copy-dependencies -DincludeScope=runtime
      - name: Exercise human game through HTTP
        shell: bash
        run: |
          set -euo pipefail
          PORT=18080 java -cp 'target/classes:target/dependency/*' com.wilddeck.app.HumanWebServer > /tmp/wild-deck-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:18080/health | grep -q ok; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:18080/ | grep -q "Wild Deck"
          curl -fsS -X POST --data-urlencode 'command=draw a card' http://localhost:18080/action -o /dev/null
          curl -fsS http://localhost:18080/ | grep -q "Drew "
          curl -fsS -X POST --data-urlencode 'command=next round' http://localhost:18080/action -o /dev/null
          curl -fsS http://localhost:18080/ | grep -q "World round"
          curl -fsS -X POST --data-urlencode 'command=auto mine on' http://localhost:18080/action -o /dev/null
          curl -fsS http://localhost:18080/ | grep -q "Automatic mining: ON"
          echo "Human web smoke tests passed"
