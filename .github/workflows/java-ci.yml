name: Java CI

on:
  push:
    branches: [ main, warfare-engine-v1, feature/live-world-playtest, feature/diplomacy-v1 ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        run: mvn --batch-mode test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser save controls
        run: node --test src/test/js/browser-save.test.cjs
